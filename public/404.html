<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="google-adsense-account" content="ca-pub-8043014881280685">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | TheGreeter</title>
    <meta name="description" content="The page you are looking for does not exist.">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon_io/android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon_io/site.webmanifest">
    <meta name="theme-color" content="#7b5df6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-primary: #f9f7ff;
            --bg-secondary: #ffffff;
            --text-primary: #1a1025;
            --text-secondary: #4a3b66;
            --accent-gradient: linear-gradient(90deg, #7b5df6 0%, #ff7a2f 100%);
            --accent-solid: #7b5df6;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 25px 40px -12px rgba(0, 0, 0, 0.12);
            --glow: rgba(123, 93, 246, 0.15);
            --mode-transition: background 0.3s ease, color 0.2s ease, border-color 0.2s;
        }

        body.dark {
            --bg-primary: #0c0719;
            --bg-secondary: #1a1230;
            --text-primary: #f0edff;
            --text-secondary: #b9aed6;
            --card-bg: rgba(30, 20, 55, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 30px 50px -15px #00000055;
            --glow: rgba(123, 93, 246, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            transition: var(--mode-transition);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(123, 93, 246, 0.08), transparent 50%), radial-gradient(circle at 80% 80%, rgba(255, 122, 47, 0.08), transparent 50%);
            pointer-events: none;
            z-index: -2;
            transition: var(--mode-transition);
            animation: gradientFlow 12s ease infinite alternate;
        }

        @keyframes gradientFlow {
            0% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        body.dark .bg-gradient {
            background: radial-gradient(circle at 20% 30%, #2d1b4e40, #0a0614 90%);
        }

        .page-404 {
            text-align: center;
            padding: 40px 24px 20px;
            width: 100%;
            max-width: 720px;
        }

        .page-404 .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: 16px;
        }

        .page-404 .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .page-404 .error-message {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: var(--text-secondary);
            max-width: 560px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }

        .support-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            text-align: center;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .support-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 0%, rgba(123, 93, 246, 0.1), transparent 60%);
            pointer-events: none;
            transition: all 0.4s;
        }

        .support-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.18);
        }

        .support-icon-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 24px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: white;
            box-shadow: 0 16px 32px -8px var(--glow);
            position: relative;
            z-index: 1;
        }

        .support-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .support-message {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 560px;
            margin: 0 auto 36px;
            position: relative;
            z-index: 1;
        }

        .support-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .support-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 16px 28px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
            min-width: 220px;
            justify-content: center;
        }

        .support-btn:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .support-btn-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .support-btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .support-btn-label {
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .support-btn-handle {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .support-btn--telegram {
            background: rgba(0, 136, 204, 0.1);
            border-color: rgba(0, 136, 204, 0.25);
            color: #0088cc;
        }

        .support-btn--telegram .support-btn-icon {
            background: #0088cc;
        }

        .support-btn--telegram:hover {
            background: rgba(0, 136, 204, 0.18);
            box-shadow: 0 12px 28px -8px rgba(0, 136, 204, 0.4);
        }

        .support-btn--instagram {
            background: rgba(225, 48, 108, 0.1);
            border-color: rgba(225, 48, 108, 0.25);
            color: #e1306c;
        }

        .support-btn--instagram .support-btn-icon {
            background: radial-gradient(circle at 30% 110%, #ffdb70, #e4405f, #833ab4);
        }

        .support-btn--instagram:hover {
            background: rgba(225, 48, 108, 0.18);
            box-shadow: 0 12px 28px -8px rgba(225, 48, 108, 0.4);
        }

        @media (max-width: 768px) {
            .support-buttons {
                flex-direction: column;
                align-items: center;
            }

            .support-btn {
                width: 100%;
                max-width: 320px;
            }
        }

        @media (max-width: 480px) {
            .support-card {
                padding: 28px 20px;
            }

            .support-icon-wrapper {
                width: 56px;
                height: 56px;
                font-size: 26px;
                border-radius: 20px;
            }

            .support-btn {
                min-width: unset;
                padding: 14px 24px;
            }

            .support-btn-icon {
                width: 38px;
                height: 38px;
                border-radius: 12px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>

    <div class="page-404">
        <div class="error-code">404</div>
        <h1 class="error-title">Error 404 - Page Not Found</h1>
        <p class="error-message">
            Sorry! The page you are looking for might have been removed, had its name changed, or is temporarily
            unavailable.
        </p>
    </div>

    <div class="support-section" style="padding: 0 24px 60px; display: flex; justify-content: center;">
        <div class="support-card">
            <div class="support-message">If You Are Facing Any Issue On Our website Contact Us --</div>
            <div class="support-buttons">
                <a href="https://t.me/TheGreeter" class="support-btn support-btn--telegram" target="_blank"
                    rel="noopener noreferrer" aria-label="Message us on Telegram">
                    <span class="support-btn-icon">
                        <i class="fab fa-telegram-plane"></i>
                    </span>
                    <span class="support-btn-text">
                        <span class="support-btn-label">Telegram</span>
                        <span class="support-btn-handle">@TheGreeter</span>
                    </span>
                </a>
                <a href="https://instagram.com/thegreeter.in" class="support-btn support-btn--instagram" target="_blank"
                    rel="noopener noreferrer" aria-label="Message us on Instagram">
                    <span class="support-btn-icon">
                        <i class="fab fa-instagram"></i>
                    </span>
                    <span class="support-btn-text">
                        <span class="support-btn-label">Instagram</span>
                        <span class="support-btn-handle">@thegreeter.in</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
    <!-- Content Protection Script -->
    <script src="assets/content-protection.js"></script>
</body>

</html>
