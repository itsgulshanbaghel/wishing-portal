<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>We'll Be Back Soon | Greeter</title>
  <meta name="description" content="Greeter is currently undergoing brief scheduled maintenance to make your surprise experience even more magical. We will be back shortly.">
  <meta name="theme-color" content="#7b5df6">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-primary: #f9f7ff;
      --bg-card: rgba(255, 255, 255, 0.85);
      --border-card: rgba(123, 93, 246, 0.12);
      --primary: #7b5df6;
      --primary-glow: rgba(123, 93, 246, 0.2);
      --accent: #ff7a2f;
      --text-main: #1a1025;
      --text-muted: #5a4b76;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 1.25rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Soft Ambient Pastel Blobs */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: floatBlob 16s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(123, 93, 246, 0.25) 0%, rgba(224, 212, 255, 0.4) 100%);
      top: -140px;
      left: -140px;
    }

    .blob-2 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(255, 122, 47, 0.22) 0%, rgba(255, 218, 204, 0.4) 100%);
      bottom: -140px;
      right: -140px;
      animation-delay: -8s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, 35px) scale(1.08); }
      100% { transform: translate(-35px, 45px) scale(0.95); }
    }

    /* Container */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 560px;
      margin: auto 0;
      text-align: center;
    }

    /* Header Logo Badge */
    .brand-header {
      margin-bottom: 2.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border-card);
      border-radius: 99px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(123, 93, 246, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .brand-header:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(123, 93, 246, 0.14);
    }

    .brand-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Main Card */
    .main-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 32px;
      padding: 3.5rem 2.5rem;
      backdrop-filter: blur(24px);
      box-shadow: 0 24px 60px rgba(123, 93, 246, 0.12), 0 8px 24px rgba(0, 0, 0, 0.03);
    }

    /* Floating Sparkle Icon */
    .icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(16px);
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    .icon-box {
      position: relative;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ffffff 0%, #f3eeff 100%);
      border: 1.5px solid rgba(123, 93, 246, 0.2);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      background-clip: padding-box;
      box-shadow: 0 12px 28px rgba(123, 93, 246, 0.18), inset 0 2px 4px #ffffff;
    }

    .icon-box i {
      background: linear-gradient(135deg, #7b5df6 0%, #e83a59 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.2; }
      100% { transform: scale(1.15); opacity: 0.45; }
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      background: rgba(123, 93, 246, 0.08);
      border: 1px solid rgba(123, 93, 246, 0.2);
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #6d44f5;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #7b5df6;
      border-radius: 50%;
      box-shadow: 0 0 10px #7b5df6;
      animation: blinkDot 1.8s infinite ease-in-out;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Typography */
    h1.title {
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.68;
      font-weight: 500;
    }

    /* Footer */
    footer {
      margin-top: 2.25rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: center;
    }

    @media (max-width: 640px) {
      body {
        padding: 1.75rem 1rem;
      }
      .main-card {
        padding: 2.75rem 1.5rem;
        border-radius: 26px;
      }
      h1.title {
        font-size: 1.75rem;
      }
      p.subtitle {
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Pastel Glow Blobs -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <!-- Brand Header (Official Light Logo) -->
    <a href="/" class="brand-header">
      <img src="/assets/Light_logo.webp" alt="Greeter Logo" class="brand-logo-img" onerror="this.onerror=null; this.src='/light_logo.png';">
    </a>

    <!-- Main Card -->
    <div class="main-card">
      <div class="icon-wrapper">
        <div class="icon-bg"></div>
        <div class="icon-box">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
      </div>

      <div class="status-pill">
        <div class="status-dot"></div>
        <span>Brief System Maintenance</span>
      </div>

      <h1 class="title">We'll Be Back Shortly</h1>

      <p class="subtitle">
        We are currently performing a quick upgrade to make your Greeter experience even faster and more magical. All your created wishes and links are completely safe!
      </p>
    </div>

    <!-- Footer -->
    <footer>
      <p>© 2026 Greeter · Make every moment magical</p>
    </footer>
  </div>

  <!-- Silent background health check auto-redirect when server returns -->
  <script>
    (function autoRedirectWhenOnline() {
      setInterval(async () => {
        try {
          const res = await fetch('/health', { method: 'GET', cache: 'no-store' });
          if (res.ok) window.location.href = '/';
        } catch (e) {}
      }, 5000);
    })();
  </script>
</body>
</html>
